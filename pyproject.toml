[project]
name = "mogzilla"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Reproducible facial landmark learning and explainable 2D geometry"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "fastapi==0.153.0",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "idna==3.20",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.4",
    "opencv-contrib-python==5.0.0.93",
    "mediapipe==0.10.35",
    "torchvision==0.29.1",
    "opentelemetry-api==1.45.1",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "setuptools==78.1.0",
    "starlette==1.9.0",
    "sympy==1.14.0",
    "torch==2.14.1+cpu",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
